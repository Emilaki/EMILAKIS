<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming App Hub</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: #050510;
  color: white;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Phone screen container */
.app {
  width: 360px;
  height: 720px;
  background: linear-gradient(180deg, #0b0b1f, #000);
  border-radius: 30px;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(0,255,255,0.25);
  display: flex;
  flex-direction: column;
}

/* Header */
.header {
  text-align: center;
  padding: 25px 20px 10px;
}

.profile-pic {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  margin: auto;
  background: url('your-photo.jpg') center/cover;
  border: 3px solid #00ffff;
  box-shadow: 0 0 20px #00ffff;
}

.header h1 {
  margin-top: 10px;
  font-size: 22px;
  text-shadow: 0 0 8px #00ffff;
}

.header p {
  opacity: 0.8;
  font-size: 14px;
}

/* Link cards */
.links {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.card {
  display: block;
  text-decoration: none;
  color: white;
  padding: 16px;
  margin-bottom: 15px;
  border-radius: 15px;
  background: rgba(0,255,255,0.08);
  border: 1px solid rgba(0,255,255,0.3);
  backdrop-filter: blur(5px);
  transition: 0.25s;
  box-shadow: 0 0 12px rgba(0,255,255,0.2);
}

.card:hover {
  transform: scale(1.05);
  background: #00ffff;
  color: black;
  box-shadow: 0 0 25px #00ffff;
}

/* Bottom navigation */
.nav {
  display: flex;
  justify-content: space-around;
  padding: 12px;
  background: #070714;
  border-top: 1px solid rgba(0,255,255,0.2);
}

.nav span {
  font-size: 22px;
  opacity: 0.8;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="profile-pic"></div>
    <h1>Your Gamer Name</h1>
    <p>Level up with me ⚡</p>
  </div>

  <div class="links">
    <a href="#" class="card">🎮 Twitch Stream</a>
    <a href="#" class="card">📺 YouTube Channel</a>
    <a href="#" class="card">🔥 TikTok Clips</a>
    <a href="#" class="card">💬 Discord Server</a>
  </div>

  <div class="nav">
    <span>🏠</span>
    <span>🎯</span>
    <span>👤</span>
  </div>

</div>

</body>
</html>
